<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - LoadCheck</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-sidebar: #ffffff;
            --bg-main: #f8fafc;
            --text-dark: #000000;
            --text-light: #1a1a1a;
            --border: #e2e8f0;
            --card-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-dark);
            margin: 0;
            display: flex;
            min-height: 100vh;
        }

        /* --- Sidebar Navigation --- */
        .sidebar {
            width: 260px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
        }

        .brand-section {
            padding: 2rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .nav-menu {
            list-style: none;
            padding: 0 0.75rem;
            margin: 0;
            flex-grow: 1;
        }

        .nav-item {
            text-decoration: none;
            color: var(--text-light);
            font-weight: 500;
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            gap: 12px;
            border-radius: 8px;
            margin-bottom: 4px;
            transition: all 0.2s;
        }

        .nav-item:hover {
            background: #f1f5f9;
            color: var(--text-dark);
        }

        .nav-item.active {
            background: #eff6ff;
            color: var(--primary);
        }

        .logout-btn {
            margin: 1rem 0.75rem 2rem;
            padding: 0.75rem 1rem;
            color: #ef4444;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            border-top: 1px solid var(--border);
            padding-top: 1.5rem;
        }

        /* --- Main Content Area --- */
        .content-area {
            margin-left: 260px;
            flex-grow: 1;
            padding: 2.5rem 3rem;
            max-width: 1300px;
        }

        .page-header {
            margin-bottom: 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .page-header h2 {
            margin: 0;
            font-size: 1.875rem;
            font-weight: 700;
        }

        .page-header p {
            margin: 0.25rem 0 0;
            color: var(--text-light);
        }

        /* --- Metrics Grid --- */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .metric-card {
            background: #fff;
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: var(--card-shadow);
        }

        .metric-label {
            color: var(--text-light);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .metric-value {
            font-size: 2rem;
            font-weight: 700;
            margin: 0.5rem 0;
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .metric-subtext {
            font-size: 0.875rem;
            color: var(--text-light);
        }

        /* --- Filters & Search --- */
        .action-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            align-items: center;
        }

        .search-box {
            flex-grow: 1;
            position: relative;
        }

        .input-field {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.93rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* --- Table Styling --- */
        .table-container {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
        }

        .table-title {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-title h3 {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 700;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f8fafc;
            text-align: left;
            padding: 0.875rem 1.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-light);
            text-transform: uppercase;
        }

        td {
            padding: 1.125rem 1.5rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.93rem;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-GREEN {
            background: #dcfce7;
            color: #166534;
        }

        .badge-YELLOW {
            background: #fef9c3;
            color: #854d0e;
        }

        .badge-RED {
            background: #fee2e2;
            color: #991b1b;
        }

        .btn-manage {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.875rem;
        }

        .btn-manage:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <aside class="sidebar">
        <div class="brand-section">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
            </svg>
            LoadCheck
        </div>
        <nav class="nav-menu">
            <a href="dashboard.html" class="nav-item active">Overview</a>
            <a href="create-trip.html" class="nav-item">Create Trip</a>
            <a href="#" class="nav-item">My Trips</a>
            <a href="profile.html" class="nav-item">Profile</a>
        </nav>
        <a href="#" id="logoutBtn" class="logout-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            Logout
        </a>
    </aside>

    <main class="content-area">
        <div class="page-header">
            <div>
                <h2>Dashboard</h2>
                <p>Welcome back, <span id="userName" style="color: var(--text-dark); font-weight: 600;">Venkatesh</span>
                </p>
            </div>
        </div>

        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-label">Safety Score</div>
                <div class="metric-value" style="color: #10b981;">98%</div>
                <div class="metric-subtext">Avg across 12 trips</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Active Trips</div>
                <div class="metric-value" id="activeTripsCount">0</div>
                <div class="metric-subtext">Currently in transit</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Pending Actions</div>
                <div class="metric-value" style="color: #f59e0b;">3</div>
                <div class="metric-subtext">Require attention</div>
            </div>
        </div>

        <div class="action-bar">
            <div class="search-box">
                <input type="text" id="searchInput" class="input-field" placeholder="Search Vehicle RC or Trip ID...">
            </div>
            <select id="statusFilter" class="input-field" style="width: 200px; cursor: pointer;">
                <option value="all">All Status</option>
                <option value="created">Created</option>
                <option value="in_transit">In Transit</option>
                <option value="completed">Completed</option>
            </select>
        </div>

        <div class="table-container">
            <div class="table-title">
                <h3>Recent Trips</h3>
                <a href="#" class="btn-manage" style="font-size: 0.8rem;">View All</a>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Trip ID</th>
                        <th>Date</th>
                        <th>Vehicle</th>
                        <th>Driver</th>
                        <th>Route</th>
                        <th>Risk</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="tripTableBody">
                </tbody>
            </table>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script>
        let allTrips = [];

        document.addEventListener('DOMContentLoaded', async () => {
            const user = auth.requireAuth();
            if (user) document.getElementById('userName').textContent = user.name;

            try {
                const response = await fetch(`${API_BASE}/api/trip/my-trips/${user.id}`);
                if (!response.ok) throw new Error('Failed to fetch data');
                allTrips = await response.json();
                renderTrips(allTrips);
            } catch (err) {
                console.error("Dashboard Load Error:", err);
            }

            document.getElementById('logoutBtn').addEventListener('click', (e) => {
                e.preventDefault();
                auth.logout();
            });

            document.getElementById('searchInput').addEventListener('input', filterTrips);
            document.getElementById('statusFilter').addEventListener('change', filterTrips);
        });

        function filterTrips() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const status = document.getElementById('statusFilter').value;

            const filtered = allTrips.filter(trip => {
                const matchesSearch = trip.id.toLowerCase().includes(query) ||
                    (trip.vehicle && trip.vehicle.number.toLowerCase().includes(query));
                const matchesStatus = status === 'all' || trip.status === status;
                return matchesSearch && matchesStatus;
            });
            renderTrips(filtered);
        }

        function renderTrips(trips) {
            const tbody = document.getElementById('tripTableBody');
            tbody.innerHTML = '';

            if (trips.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding: 3rem; color: #94a3b8;">No matching trips found.</td></tr>';
                return;
            }

            [...trips].reverse().forEach(trip => {
                const date = trip.created_at ? new Date(trip.created_at).toLocaleDateString() : 'N/A';
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-family: monospace; font-weight: 600;">#${trip.id.substring(0, 8)}</td>
                    <td>${date}</td>
                    <td><span style="background: #f1f5f9; padding: 4px 8px; border-radius: 4px; font-weight: 600;">${trip.vehicle?.number || 'N/A'}</span></td>
                    <td>${trip.driver?.name || 'Unknown'}</td>
                    <td style="color: var(--text-light); font-size: 0.85rem;">${trip.cargo?.source} &rarr; ${trip.cargo?.destination}</td>
                    <td><span class="badge badge-${trip.risk_color}">${trip.risk_color}</span></td>
                    <td style="text-transform: capitalize; font-weight: 500;">${trip.status.replace('_', ' ')}</td>
                    <td><a href="trip-summary.html?id=${trip.id}" class="btn-manage">Manage</a></td>
                `;
                tbody.appendChild(tr);
            });

            updateDashboardStats(allTrips);
        }

        function updateDashboardStats(trips) {
            // 1. Safety Score (Simple Logic: % of Green Trips)
            const totalTrips = trips.length;
            const safeTrips = trips.filter(t => t.risk_color === 'GREEN').length;
            const safetyScore = totalTrips > 0 ? Math.round((safeTrips / totalTrips) * 100) : 100;

            const safetyScoreEl = document.querySelector('.metric-card:nth-child(1) .metric-value');
            if (safetyScoreEl) {
                safetyScoreEl.textContent = `${safetyScore}%`;
                // Optional: Change color based on score
                safetyScoreEl.style.color = safetyScore >= 80 ? '#10b981' : (safetyScore >= 50 ? '#f59e0b' : '#ef4444');
            }

            const safetySubtext = document.querySelector('.metric-card:nth-child(1) .metric-subtext');
            if (safetySubtext) safetySubtext.textContent = `Based on ${totalTrips} trips`;

            // 2. Active Trips
            const activeCount = trips.filter(t => t.status === 'in_transit' || t.status === 'created').length;
            const activeTripsEl = document.getElementById('activeTripsCount');
            if (activeTripsEl) activeTripsEl.textContent = activeCount;

            // 3. Pending Actions (Risk = RED or Status = Created)
            const pendingCount = trips.filter(t => t.risk_color === 'RED' || t.status === 'created').length;
            const pendingEl = document.querySelector('.metric-card:nth-child(3) .metric-value');
            if (pendingEl) pendingEl.textContent = pendingCount;
        }
    </script>
</body>

</html>
