<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Trip - LoadCheck</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/colors.css">
    <link rel="stylesheet" href="styles/dashboard.css">
    <style>
        .public-view-card {
            max-width: 600px;
            margin: 4rem auto;
            border-top: 5px solid var(--color-accent);
        }
    </style>
</head>

<body>
    <nav style="background: var(--color-bg-card); border-bottom: 1px solid var(--color-border);">
        <div class="container"
            style="display: flex; justify-content: space-between; align-items: center; height: 70px;">
            <a href="index.html" style="font-weight: 700; font-size: 1.5rem; color: var(--color-primary);">LoadCheck</a>
            <a href="login.html" class="btn btn-outline" style="padding: 0.5rem 1rem; font-size: 0.875rem;">Login</a>
        </div>
    </nav>

    <div class="container">
        <div class="card public-view-card">
            <header class="header"
                style="justify-content: center; flex-direction: column; gap: 0.5rem; text-align: center;">
                <h2 style="font-size: 1.5rem;">Trip Tracking</h2>
                <span class="badge badge-green" style="font-size: 1rem; padding: 0.5rem 1rem;">Risk Status: LOW
                    (Safe)</span>
            </header>

            <div style="margin: 2rem 0; text-align: center;">
                <div style="font-size: 0.875rem; color: var(--color-text-muted); margin-bottom: 0.5rem;">CARGO TYPE
                </div>
                <div style="font-size: 1.25rem; font-weight: 600;">General Goods / Electronics</div>
            </div>

            <div style="background: #F8FAFC; padding: 2rem; border-radius: var(--radius-md); margin-bottom: 2rem;">
                <!-- Route Visual -->
                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem;">
                    <div style="text-align: left;">
                        <div style="font-size: 0.75rem; color: var(--color-text-muted);">ORIGIN</div>
                        <div style="font-weight: 600;">Mumbai</div>
                    </div>
                    <div style="flex: 1; margin: 0 1rem; height: 2px; background: #e2e8f0; position: relative;">
                        <!-- Progress dot -->
                        <div
                            style="position: absolute; top: 50%; left: 40%; width: 10px; height: 10px; background: var(--color-accent); border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 0 4px rgba(59,130,246,0.2);">
                        </div>
                    </div>
                    <div style="text-align: right;">
                        <div style="font-size: 0.75rem; color: var(--color-text-muted);">DESTINATION</div>
                        <div style="font-weight: 600;">Pune</div>
                    </div>
                </div>
                <div style="text-align: center; margin-top: 1.5rem;">
                    <div style="font-size: 0.75rem; color: var(--color-text-muted);">ESTIMATED ARRIVAL</div>
                    <div style="font-size: 1.1rem; color: var(--color-accent); font-weight: 600;">Today, 4:00 PM</div>
                </div>
            </div>

            <div style="text-align: center;">
                <p style="font-size: 0.875rem; color: var(--color-text-muted);">
                    Note: Sensitive details (Driver/Vehicle ID) are hidden for privacy.
                </p>
                <a href="index.html"
                    style="display: inline-block; margin-top: 1.5rem; color: var(--color-accent); font-weight: 500;">Go
                    Home</a>
            </div>
        </div>
    </div>
</body>

</html>
